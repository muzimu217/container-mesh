# The nginx configuration for the coordination hub.
#
# ★ T-4.6 SAYS "ONLY ADD A location, DO NOT CREATE A NEW SERVER BLOCK".
#   This file IS a new server block. It is kept as its own file
#   because the host it was written for had no site of its own — but
#   ★ ON A HOST THAT ALREADY SERVES new.blackevil.cn, DO NOT DEPLOY
#   THIS AS-IS. Copy the two locations into the existing server block
#   instead. A second server block with the same server_name takes the
#   whole vhost — which is exactly the incident T-4.6 was written
#   about.
#
# WHY BOTH FAMILIES ARE LISTENED ON
#
#   The cloud security group filters IPv4 80/443. It does NOT filter
#   IPv6 (measured: IPv4:443 times out at 4.00s, IPv6:443 answers with
#   an RST in 0.05s — the packet reached the host). So:
#
#     listen 80;      listen [::]:80;
#     listen 443 ssl; listen [::]:443 ssl;
#
#   The IPv6 listeners are what make the channel work at all on a host
#   whose security group only allows SSH. The IPv4 ones are there so
#   the same configuration works on a host whose security group allows
#   them.
#
# THE ACME CHALLENGE IS SERVED ON PLAIN HTTP
#
#   The certificate is issued over HTTP-01, so /.well-known/ must be
#   reachable over port 80 — and it must NOT be redirected to HTTPS,
#   or the challenge can never be answered. That is why there is no
#   "return 301 https://…" here.
#
#   ⚠️ The consequence: /hub/ is ALSO reachable over plain HTTP on
#   port 80, and the hub's ONLY credential is the shared token — so on
#   that port the token travels in cleartext. If you add a redirect,
#   exempt this location from it, and prefer the HTTPS one.

server {
    listen 80;
    listen [::]:80;
    server_name new.blackevil.cn;

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate     /etc/letsencrypt/live/new.blackevil.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.blackevil.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:2m;
    ssl_session_timeout 1d;

    # The HTTP-01 challenge. Must stay on plain HTTP, must not redirect.
    location /.well-known/acme-challenge/ {
        root /var/lib/cmesh-acme/webroot;
        default_type "text/plain";
    }

    location /hub/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        # ★ nginx's limit is a BACKSTOP, deliberately ABOVE the hub's.
        #
        #   The hub's real limit is 256 KiB (262144 bytes) and it
        #   answers 413 with "body too large: the limit is 262144
        #   bytes" — a message the agent can act on.
        #
        #   If nginx's limit were the SAME number, nginx would reject
        #   the body FIRST and the agent would get an HTML error page
        #   instead of the hub's message. So nginx sits above: the hub
        #   speaks first for anything in the band, and nginx's plain
        #   HTML only appears for a body so oversized that it never
        #   reached the hub.
        #
        #   With `curl -f` both are visible (exit code 22), so a
        #   rejected report can no longer look like a delivered one.
        client_max_body_size 300k;
    }
}
