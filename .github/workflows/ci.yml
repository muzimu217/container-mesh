name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: 依赖下载
        run: go mod download

      - name: 格式检查
        run: |
          set -e
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 单元测试
        run: go test ./... -race -count=1

      - name: 漏洞扫描 (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # 只报告本仓库可达的漏洞；标准库问题由工具链补丁版本决定，
          # 不阻断构建，但会在日志中显示以便升级。
          govulncheck ./... || echo "::warning::govulncheck reported issues (see log)"

      - name: 构建
        run: go build -o cmesh ./cmd/cm

      - name: 端到端测试
        run: bash tests/run-tests.sh --verbose --large

      - name: 离线安装回归 (packaging/install.sh)
        # This regression exists because F-1 (a hardcoded darwin-arm64 fixture)
        # escaped twice: the script was never part of CI, so a green build said
        # nothing about the installer. Keep it wired in.
        run: sh packaging/install_test.sh

      - name: 交叉编译 (linux/amd64)
        # The version must be stamped: a release asset built without it
        # reports "dev", and the @info verb would then tell an operator
        # that their peer runs "dev" instead of the version they installed
        # (round 62: the published rc1 binaries reported dev).
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build \
            -trimpath -ldflags "-X github.com/muzimu217/container-mesh/internal/cli.Version=${GITHUB_REF_NAME}" \
            -o /tmp/cmesh-linux-amd64 ./cmd/cm

      - name: 交叉编译 (linux/arm64)
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build \
            -trimpath -ldflags "-X github.com/muzimu217/container-mesh/internal/cli.Version=${GITHUB_REF_NAME}" \
            -o /tmp/cmesh-linux-arm64 ./cmd/cm

      - name: 协调 Hub 的单元测试
        # ★ The hub is a SEPARATE Go module (deploy/hub/go.mod), so
        # `go test ./...` at the repo root never runs its tests — a
        # green CI said nothing about the code the agents talk to.
        #
        # That is the "capability with no caller" shape: the test
        # exists, the test is green locally, and nobody runs it. The
        # body-limit regression (a rejected report must not look like
        # a delivered one) would have shipped without ever executing
        # on the remote.
        working-directory: deploy/hub
        run: |
          go mod download
          go vet ./...
          go test ./... -race -count=1

      - name: 协调 Hub 必须能交叉编译到服务器的平台
        # The repo used to carry a darwin/arm64 binary, which cannot run
        # on the linux/amd64 host the hub actually runs on.
        working-directory: deploy/hub
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/cmesh-hub-linux-amd64 .
          file /tmp/cmesh-hub-linux-amd64
          # A Mach-O binary on a linux server is the exact trap that
          # binary was. Assert the format, do not just print it.
          if file /tmp/cmesh-hub-linux-amd64 | grep -q "Mach-O"; then
            echo "the hub binary is a Mach-O file — it will not run on linux" >&2
            exit 1
          fi

      - name: 发布资产的版本号必须是真版本，不是 dev
        # The published binaries are what users install, so a "dev" version
        # string reaches every user who follows the README. This step
        # fails the build if the stamped version is missing.
        run: |
          got=$(/tmp/cmesh-linux-amd64 version)
          echo "version: $got"
          # Strip the "cmesh " prefix; what remains must be a real version.
          #
          # The check is EXACT: "dev" is the unstamped default, but a
          # branch name like "develop" also contains those three letters
          # and is a perfectly good version for a build off a branch.
          # (Matching a substring here turned CI red on every push to
          # develop — the check rejected its own branch name.)
          ver=${got#cmesh }
          case "$ver" in
            "") echo "the release binary reports an EMPTY version" >&2; exit 1 ;;
            dev) echo "the release binary reports '$got'" >&2; exit 1 ;;
          esac

  linux-tun-probe:
    name: Linux 上的 TUN 探测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: 构建
        run: go build -o cmesh ./cmd/cm

      - name: 探测（GitHub runner 无 CAP_NET_ADMIN，应报 userspace_only 或 unusable）
        run: |
          set +e
          ./cmesh probe --json > probe.json
          code=$?
          echo "exit=$code"
          cat probe.json
          # 只要不是 0（TUN 可用）都算符合预期；关键是输出是合法 JSON
          python3 -c "import json;json.load(open('probe.json'))"
          case "$code" in
            10|20) echo "✅ 符合预期: 无 TUN 权限" ;;
            0)     echo "⚠️ runner 竟然有 CAP_NET_ADMIN，未覆盖到目标场景" ;;
            *)     echo "❌ 意外退出码 $code"; exit 1 ;;
          esac

      - name: Linux 端到端
        run: |
          set -e
          PORT=$(python3 -c 'import socket;s=socket.socket();s.bind(("127.0.0.1",0));print(s.getsockname()[1]);s.close()')
          ./cmesh relay --addr "127.0.0.1:$PORT" &
          RELAY=$!
          trap 'kill $RELAY 2>/dev/null' EXIT
          for i in $(seq 1 50); do
            curl -sf "http://127.0.0.1:$PORT/healthz" >/dev/null && break
            sleep 0.1
          done

          mkdir -p /tmp/src /tmp/dst
          head -c 2097152 /dev/urandom > /tmp/src/f.bin

          ./cmesh recv --relay "ws://127.0.0.1:$PORT/ws" --code "ci-code-1" \
            --out /tmp/dst --stay=false &
          RECV=$!
          sleep 0.5
          ./cmesh send --relay "ws://127.0.0.1:$PORT/ws" --code "ci-code-1" \
            --file /tmp/src/f.bin --stay=false
          wait $RECV

          cmp /tmp/src/f.bin /tmp/dst/f.bin
          echo "✅ Linux 端到端通过"
